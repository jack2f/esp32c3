# ========== 全局变量 ==========
substitutions:
  device_name: c4002
  friendly_name: c4002
  allowed_characters: "状态距离无目标静止存在运动中未知方向速度.0123456789m/s"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2025.5.0
  name_add_mac_suffix: true

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components/

logger:

api:
  id: api_server

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# ========== SPI 总线（ST7735S 彩色显示屏）==========
spi:
  id: spi_bus
  clk_pin: GPIO4
  mosi_pin: GPIO3

# ========== UART（C4002 雷达）==========
uart:
  id: uart_bus
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 115200

# ========== 背光控制（PWM 调光）==========
output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO10
    frequency: 1000Hz

light:
  - platform: monochromatic
    id: display_backlight
    output: backlight_pwm
    name: "Display Backlight"
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_ON

# ========== C4002 雷达组件 ==========
dfrobot_c4002:
  id: my_c4002

# ========== 字体配置 ==========
font:
  - file:
      type: gfonts
      family: "Noto Sans SC"
      weight: 400
      italic: false
    id: cn_font
    size: 14
    glyphs: ${allowed_characters}
    ignore_missing_glyphs: true

# ========== ST7735S 彩色显示屏 ==========
display:
  - platform: st7735
    id: tft_display
    model: INITR_18BLACKTAB
    spi_id: spi_bus
    cs_pin: GPIO7
    dc_pin: GPIO1
    reset_pin: GPIO0
    rotation: 0
    device_width: 128
    device_height: 160
    col_start: 0
    row_start: 0
    eight_bit_color: false
    update_interval: 500ms
    lambda: |-
      it.fill(Color::BLACK);
      
      int status = id(target_status_sensor).state;
      
      // 标题栏
      it.filled_rectangle(0, 0, 128, 20, Color(0, 100, 200));
      it.printf(4, 3, id(cn_font), Color::WHITE, "C4002 雷达");
      
      if (status == 0) {
        it.printf(24, 60, id(cn_font), Color(150, 150, 150), "无目标");
      }
      else if (status == 1) {
        it.printf(4, 30, id(cn_font), Color(0, 255, 0), "静止存在");
        if (!isnan(id(existing_distance_sensor).state) && id(existing_distance_sensor).state > 0) {
          it.printf(4, 55, id(cn_font), Color::WHITE, "距离：%.1f m", id(existing_distance_sensor).state);
        }
      }
      else if (status == 2) {
        it.printf(4, 30, id(cn_font), Color(255, 100, 0), "运动中");
        if (!isnan(id(existing_distance_sensor).state) && id(existing_distance_sensor).state > 0) {
          it.printf(4, 55, id(cn_font), Color::WHITE, "距离：%.1f m", id(existing_distance_sensor).state);
        }
        it.printf(4, 80, id(cn_font), Color(0, 200, 255), "方向：%s", id(movement_direction_text).state.c_str());
        if (!isnan(id(movement_speed_sensor).state)) {
          it.printf(4, 105, id(cn_font), Color(255, 255, 0), "速度：%.1f m/s", id(movement_speed_sensor).state);
        }
      }
      else {
        it.printf(24, 60, id(cn_font), Color(255, 0, 0), "未知状态");
      }
      
      // 底部状态条
      it.filled_rectangle(0, 150, 128, 10, Color(50, 50, 50));
      it.printf(2, 150, id(cn_font), Color::WHITE, "API:%s", 
                (id(api_server).is_connected() ? "OK" : "--"));

# ========== 传感器配置 ==========
sensor:
  - platform: dfrobot_c4002
    c4002_id: my_c4002
    movement_distance:
      name: "1.运动距离"
      id: movement_distance_sensor
    existing_distance:
      name: "2.存在距离"
      id: existing_distance_sensor
    movement_speed:
      name: "3.移动速度"
      id: movement_speed_sensor
    movement_direction:
      name: "4.运动方向"
      id: movement_direction_sensor
      internal: true
    target_status:
      name: "Target Status"
      id: target_status_sensor
      internal: true

# ========== 文本传感器 ==========
text_sensor:
  - platform: template
    name: "Movement Direction"
    id: movement_direction_text
    icon: "mdi:directions"
    lambda: |-
      int d = id(movement_direction_sensor).state;
      if (d == 0) return {"远离"};
      else if (d == 1) return {"无方向"};
      else if (d == 2) return {"靠近"};
      else return {"未知"};
    update_interval: 1s

  - platform: template
    name: "Target Status"
    id: target_status_text
    icon: "mdi:human-greeting"
    lambda: |-
      int d = id(target_status_sensor).state;
      if (d == 0) return {"无目标"};
      else if (d == 1) return {"静止存在"};
      else if (d == 2) return {"运动中"};
      else return {"未知"};
    update_interval: 0.5s

  - platform: dfrobot_c4002
    c4002_id: my_c4002
    c4002_text_sensor:
      name: "C4002 log"
      icon: "mdi:message-text-outline"

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_addr
    ssid:
      name: "WiFi SSID"

# ========== 开关配置 ==========
switch:
  - platform: dfrobot_c4002
    c4002_id: my_c4002
    switch_out_led:
      name: "Out LED Switch"
    switch_run_led:
      name: "Run LED Switch"
    switch_factory_reset:
      name: "Factory Reset"
    switch_environmental_calibration:
      name: "Sensor Calibration"

# ========== Select 配置 ==========
select:
  - platform: dfrobot_c4002
    c4002_id: my_c4002
    operating_mode:
      name: "OUT Mode"
      options:
        - "Mode_1"
        - "Mode_2"
        - "Mode_3"

# ========== Number 配置 ==========
number:
  - platform: dfrobot_c4002
    c4002_id: my_c4002
    max_range:
      name: "Max detection distance"
    min_range:
      name: "Min detection distance"
    light_threshold:
      name: "Light Threshold"
    target_disappeard_delay_time:
      name: "Target Disappear Delay Time"
